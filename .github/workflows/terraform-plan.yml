name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'lambda/moderation/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev-plan
    env:
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN || 'arn:aws:iam::469072180472:role/dambda-github-plan' }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Initialize remote state
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET || 'dambda-469072180472-terraform-state' }}"
          -backend-config="key=${{ vars.TF_STATE_KEY || 'dambda/production.tfstate' }}"
          -backend-config="region=${{ vars.TF_STATE_REGION || vars.AWS_REGION || 'ap-northeast-2' }}"
          -backend-config="use_lockfile=true"
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - name: Create plan
        env:
          TF_VAR_bedrock_guardrail_profile_identifier: ${{ vars.BEDROCK_GUARDRAIL_PROFILE_ARN }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Render plan
        run: terraform show -no-color tfplan > plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.pull_request.number }}
          path: terraform/plan.txt
          retention-days: 7
